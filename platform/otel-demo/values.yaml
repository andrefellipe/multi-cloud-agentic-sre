# Values for the OpenTelemetry Demo chart 0.42.6 (app 3.1.0), the same on every
# cloud (REQ-023). Fleet passes them to Helm unchanged (fleet.yaml).
#
# - Images are pinned by digest (REQ-112.1). The chart builds each demo image as
#   ghcr.io/open-telemetry/demo:<tag>, so each tag below is "3.1.0-<component>"
#   plus the digest of its multi-arch index (linux/amd64 and linux/arm64, for the
#   Graviton nodes). The chart's init containers use busybox:latest, so each one
#   is restated with busybox 1.38.0 by digest. Digests were read from the
#   registries on 2026-11-12.
# - The chart's own Collector, Jaeger, Prometheus, Grafana and OpenSearch are off.
#   Every service sends OTLP to the platform Collector (platform/otel-collector),
#   which exports to Managed Prometheus and CloudWatch (REQ-024).
# - The load generator runs at its lowest setting: one simulated user and no
#   browser traffic (scalability-design.md, SC-4).
# - flagd reads the base flags from the ConfigMap flagd-base-flags, which the root
#   bundle generates from platform/base/flags/demo.flagd.json (BR8.5). flagd
#   reloads the file when the ConfigMap changes, so the running flags follow Git.
#   The flagd UI sidecar is removed, because it edits a copy that flagd no longer
#   reads; a flag is set out of band by editing that ConfigMap in the cluster,
#   which Fleet then shows as drift (docs/runbooks/phase-1-skeleton.md). The
#   chart's own ConfigMap flagd-config is still created, and is unused.

default:
  envOverrides:
    - name: OTEL_COLLECTOR_NAME
      value: otel-collector.observability.svc.cluster.local

components:
  accounting:
    imageOverride:
      tag: "3.1.0-accounting@sha256:bfd9d13ac58a4eb5eb5130aa9ac1920686e2214030f4f2ab8bf178121879fcd9"
    initContainers:
      - name: wait-for-kafka
        image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
        command: ["sh", "-c", "until nc -z -v -w30 kafka 9092; do echo waiting for kafka; sleep 2; done;"]

