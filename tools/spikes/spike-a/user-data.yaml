#cloud-config
# Spike A (docs/runbooks/phase-0.md, section 6): Docker, then single-node Rancher
# 2.15.3, the version the lab runs, pinned by the digest of its multi-arch image.
# cloud-init installs the package itself and waits for the apt lock that Ubuntu's
# own first-boot updates may hold.
package_update: true
packages:
  - docker.io
runcmd:
  - systemctl enable --now docker
  - docker run -d --name rancher --restart=unless-stopped -p 80:80 -p 443:443 --privileged rancher/rancher:v2.15.3@sha256:3f3a50c6e49c1cf5b4673bef236e0f260f36055de4d073438e38c441dc97aa9b
